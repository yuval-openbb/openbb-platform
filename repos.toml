# Manifest of every repo that makes up the platform. `make bootstrap` clones missing ones,
# `make sync` fetches upstream and fast-forwards the fork's ref. Forks keep `main` == upstream;
# local changes go on `yuval/<topic>` branches and get pinned here via `ref`.

[[repo]]
name = "openbb-research"
path = "research"
origin = "https://github.com/yuval-openbb/openbb-research.git"
ref = "main"
private = true

